services:
  app:
    build: .
    container_name: tinhgiathau
    restart: unless-stopped
    ports:
      - "3456:3456"
    environment:
      - PORT=3456
      - TRELLO_API_KEY=${TRELLO_API_KEY}
      - TRELLO_TOKEN=${TRELLO_TOKEN}
      - TRELLO_LIST_PREPARING=${TRELLO_LIST_PREPARING}
      - TRELLO_LIST_APPROVED=${TRELLO_LIST_APPROVED}
      - TRELLO_LIST_REJECTED=${TRELLO_LIST_REJECTED}
      - TRELLO_LIST_WIN=${TRELLO_LIST_WIN}
      - TRELLO_LIST_LOSE=${TRELLO_LIST_LOSE}
      - APP_VERSION=${APP_VERSION:-dev}
      - SYNC_TOKEN=${SYNC_TOKEN}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:admin@hapro.com.vn}
      - BACKUP_ENABLED=${BACKUP_ENABLED:-true}
      - BACKUP_DIR=${BACKUP_DIR:-./backup}
      - BACKUP_KEEP_LOCAL=${BACKUP_KEEP_LOCAL:-30}
      - BACKUP_GIT_REPO=${BACKUP_GIT_REPO}
      - BACKUP_GIT_TOKEN=${BACKUP_GIT_TOKEN}
    volumes:
      - ./data:/app/data
      - ./backup:/app/backup
