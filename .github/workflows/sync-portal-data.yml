name: Sync Portal Data

on:
  schedule:
    - cron: '0 2 * * *'   # 2:00 AM UTC = 9:00 AM ICT
  workflow_dispatch:        # manual trigger

jobs:
  fetch-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies (incl. Playwright)
        run: npm ci && npx playwright install chromium

      - name: Pull current data from VPS
        if: env.VPS_HOST != ''
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: /opt/dauthau/data/projects.json
          target: data/

      - name: Run batch fetch
        run: node scripts/gh-fetch.js

      - name: Push updated data to VPS
        if: env.VPS_HOST != ''
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: data/projects.json
          target: /opt/dauthau/data/

      - name: Restart app on VPS
        if: env.VPS_HOST != ''
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: nssm restart Dauthau

      - name: Commit sync report back to repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/sync-report.json
          git diff --staged --quiet || git commit -m "chore: update sync report $(date +%Y-%m-%d)"
          git push
