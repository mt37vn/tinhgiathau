name: Daily Bot & Portal Sync

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-all:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
    steps:
      - uses: actions/checkout@v7

      # === Scan bids (Python bot) ===
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: |
          pip install requests playwright
          python -m playwright install chromium
      - name: Pull tracking files from VPS
        if: env.SERVER_HOST != ''
        shell: bash
        run: |
          mkdir -p data
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
          scp -o StrictHostKeyChecking=no "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/dauthau/data/processed_ids.json" data/ 2>/dev/null || echo '{"ids":[],"updatedAt":null}' > data/processed_ids.json
          scp -o StrictHostKeyChecking=no "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/dauthau/data/discarded_ids.json" data/ 2>/dev/null || echo '{"ids":[],"updatedAt":null}' > data/discarded_ids.json
      - name: Scan for new bids
        env:
          TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          TRELLO_LIST_ID: ${{ secrets.TRELLO_LIST_ID }}
          TINHGIA_API_URL: ${{ secrets.TINHGIA_API_URL }}
        run: python bot_thau.py

      - name: Upload debug screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: search-page-debug
          path: /tmp/search_page_fail.png
          if-no-files-found: ignore

      # === Push processed/discarded IDs to VPS (JSON, not git) ===
      - name: Push ID files to VPS
        if: env.SERVER_HOST != ''
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "data/processed_ids.json,data/discarded_ids.json"
          target: /opt/dauthau/data/
          strip_components: 1

      # === Sync portal items (Node.js) ===
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
      - name: Install Node dependencies
        run: npm ci && npx playwright install chromium
      - name: Pull projects.json from VPS
        if: env.SERVER_HOST != ''
        shell: bash
        run: |
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/dauthau/data/projects.json" data/ 2>/dev/null || echo '{"projects":[]}' > data/projects.json
      - name: Fetch portal items
        run: node scripts/gh-fetch.js
      - name: Push updated data to VPS
        if: env.SERVER_HOST != ''
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: data/projects.json
          target: /opt/dauthau/data/
      - name: Restart app on VPS
        if: env.SERVER_HOST != ''
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: nssm restart Dauthau

      # === Commit changes (only sync-report.json) ===
      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          for f in data/sync-report.json; do
            [ -f "$f" ] && git add -f "$f" || true
          done
          git diff --staged --quiet || git commit -m "chore: daily update $(date +%Y-%m-%d)"
          git pull --rebase --autostash
          git push
