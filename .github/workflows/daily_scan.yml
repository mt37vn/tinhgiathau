name: Bot Mua Sam Cong Daily

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    # THÊM DÒNG NÀY ĐỂ CẤP QUYỀN GHI
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests playwright
          python -m playwright install chromium

      - name: Run Bot
        env:
          TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          TRELLO_LIST_ID: ${{ secrets.TRELLO_LIST_ID }}
          TINHGIA_API_URL: ${{ secrets.TINHGIA_API_URL }}
        run: python bot_thau.py

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add processed_ids.txt discarded_ids.txt
          git commit -m "Update processed bidding IDs" || exit 0
          git push
